[package]
name = "provlita"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A native Sophia GPU dock inspired by Gershwin"
license = "BSD-3-Clause"
repository = "https://github.com/sophia-org/provlita"
publish = false

[lints.rust]
missing_docs = "warn"

[dependencies]
sophia-shell-gpu = { path = "../lom/crates/shell-gpu" }
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
tokio = { version = "1.50", features = ["rt", "sync"] }

[dev-dependencies]
imaging_vello_cpu = "0.0.1"
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
